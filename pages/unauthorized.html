<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied - EduCore Uganda</title>
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/utilities.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-deep);
      padding: var(--space-3);
    }
    .unauthorized-card {
      text-align: center;
      max-width: 480px;
    }
    .unauthorized-icon {
      width: 80px;
      height: 80px;
      background: var(--color-danger-muted);
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto var(--space-3);
    }
    .unauthorized-icon svg {
      width: 40px;
      height: 40px;
      color: var(--color-danger);
    }
    .unauthorized-title {
      font-size: var(--text-2xl);
      font-weight: var(--font-weight-bold);
      margin-bottom: var(--space-1);
    }
    .unauthorized-text {
      color: var(--text-secondary);
      margin-bottom: var(--space-4);
    }
  </style>
</head>
<body>
  <div class="unauthorized-card">
    <div class="unauthorized-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>
    <h1 class="unauthorized-title">Access Denied</h1>
    <p class="unauthorized-text">You do not have permission to view this page. Please contact your administrator if you believe this is an error.</p>
    <a href="login.html" class="btn btn-primary">Back to Login</a>
  </div>
</body>
</html>
