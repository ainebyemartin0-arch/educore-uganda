<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduCore Uganda - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/utilities.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/login.css">
</head>
<body class="login-page">

  <!-- Background Effects -->
  <div class="login-bg-grid"></div>
  <div class="login-bg-orb orb-1"></div>
  <div class="login-bg-orb orb-2"></div>

  <!-- Login Card -->
  <div class="login-card">
    
    <!-- Brand -->
    <div class="login-brand">
      <div class="login-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c0 2 3 3 6 3s6-1 6-3v-5"/>
        </svg>
      </div>
      <h1 class="login-brand-name">Edu<span>Core</span></h1>
      <p class="login-brand-subtitle">Uganda School Management System</p>
    </div>

    <!-- Error Message -->
    <div class="login-error" id="loginError" role="alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="15" y1="9" x2="9" y2="15"/>
        <line x1="9" y1="9" x2="15" y2="15"/>
      </svg>
      <span id="loginErrorMessage"></span>
    </div>

    <!-- Login Form -->
    <form class="login-form" id="loginForm" novalidate>
      
      <!-- School Code -->
      <div class="school-code-section">
        <div class="school-code-label">
          <label class="form-label" for="schoolCode">School Code</label>
          <span class="school-code-hint">Provided by admin</span>
        </div>
        <div class="input-icon-wrapper">
          <input 
            type="text" 
            id="schoolCode" 
            class="input" 
            placeholder="e.g. KLA-PS-001" 
            autocomplete="off"
            maxlength="20"
            required
          >
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </div>
      </div>

      <!-- Email or Phone -->
      <div class="form-group">
        <label class="form-label" for="email">Email or Phone Number</label>
        <div class="input-icon-wrapper">
          <input 
            type="text" 
            id="email" 
            class="input" 
            placeholder="teacher@school.ug or 07XX XXX XXX" 
            autocomplete="username"
            required
          >
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-icon-wrapper">
          <input 
            type="password" 
            id="password" 
            class="input" 
            placeholder="Enter your password" 
            autocomplete="current-password"
            required
          >
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Remember & Forgot -->
      <div class="login-options">
        <label class="remember-me">
          <input type="checkbox" id="rememberMe">
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot-password" id="forgotPassword">Forgot password?</a>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn btn-primary login-submit" id="loginButton">
        Sign In
      </button>

    </form>

    <!-- Divider -->
    <div class="login-divider">
      <span>Secure Access</span>
    </div>

    <!-- Demo Info -->
    <div class="demo-info">
      <p>Demo Credentials</p>
      <code>admin@school.ug / password123</code>
    </div>

  </div>

  <!-- Scripts -->
  <script src="../js/utils/tenant.js"></script>
  <script src="../js/utils/api.js"></script>
  <script src="../js/utils/notifications.js"></script>
  <script src="../js/auth/login.js"></script>
  <script src="../js/auth/session.js"></script>

</body>
</html>
